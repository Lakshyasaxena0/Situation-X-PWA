<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Situation X</title>
<style>
  html,body{margin:0;height:100%;background:#080c16;color:#f5f1e6;font-family:system-ui,-apple-system,Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  .ring{width:46px;height:46px;border:4px solid #3a3f55;border-top-color:#f5a30a;border-radius:50%;animation:s 1s linear infinite;margin-bottom:22px}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 6px;color:#b9bdcc;font-size:14px;line-height:1.5;max-width:320px}
  button{margin-top:18px;background:#f5a30a;color:#080c16;border:0;border-radius:8px;padding:10px 18px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<main>
  <div class="ring" id="ring"></div>
  <h1 id="title">Waking up the server...</h1>
  <p id="msg">Situation X sleeps when nobody uses it. This can take up to a minute. It will open by itself.</p>
  <button onclick="check(true)">Try now</button>
</main>
<script>
  var SITE = "https://situation-x-pwa.onrender.com";
  var busy = false;
  function check(manual) {
    if (busy) return; busy = true;
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 9000);
    fetch(SITE + "/api/healthz", { cache: "no-store", signal: ctl.signal })
      .then(function (r) { return r.ok && (r.headers.get("content-type") || "").indexOf("json") >= 0; })
      .catch(function () { return false; })
      .then(function (ok) {
        clearTimeout(t); busy = false;
        if (ok) { location.replace(SITE); return; }
        if (!navigator.onLine) {
          document.getElementById("title").textContent = "No internet connection";
          document.getElementById("msg").textContent = "Connect to the internet. The app will open by itself.";
        }
      });
  }
  check(false);
  setInterval(function () { check(false); }, 4000);
  window.addEventListener("online", function () { check(true); });
</script>
</body>
</html>
