name: Keep server awake

# Render's free plan puts the server to sleep after ~15 minutes without visitors.
# GitHub only runs "every 10 minutes" schedules every few hours, so instead each run stays alive for
# ~5h50m and pings the server every 4 minutes itself. A new run is queued every hour (one waits at
# most), so when a run ends the next one starts straight away and the server never gets 15 quiet minutes.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Ping the server every 4 minutes
        run: |
          end=$(( $(date +%s) + 5*3600 + 50*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" https://situation-x-pwa.onrender.com/api/healthz || true)
            echo "$(date -u +%H:%M:%S) HTTP $code"
            sleep 240
          done
