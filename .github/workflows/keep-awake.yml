name: Keep server awake

# Render's free plan puts the server to sleep after ~15 minutes without visitors.
# This pings the health URL every 10 minutes so the first real visitor does not wait.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the server
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" https://situation-x-pwa.onrender.com/api/healthz || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 0
