# Builds the Android app (APK) for Situation X and publishes it as a GitHub Release, so there is one link
# anyone can open on a phone to download it.
#
# Run it: GitHub -> Actions -> "Build Android APK" -> Run workflow. The APK appears under Releases
# (tag "android-latest"), and the file link is:
#   https://github.com/<owner>/<repo>/releases/latest/download/Situation-X.apk
#
# Optional but recommended (so a new version installs over the old one): add these repository secrets
#   ANDROID_KEYSTORE_BASE64   the keystore file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a temporary key: it installs fine, but a later build must be
# installed after uninstalling the old app.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK (ANDROID_HOME); only the licences need accepting so Gradle
      # can fetch any missing part.
      - name: Android SDK licences
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true
          (yes | "$SDKM" --licenses > /dev/null) || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Install Capacitor and sync
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "Using the repository signing key"
          else
            KS_PASS=situationx-temp; KS_ALIAS=situationx; KEY_PASS=situationx-temp
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" -alias "$KS_ALIAS" \
              -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Situation X, O=Faraksh, C=IN"
            echo "::warning::No signing key secret found: signed with a temporary key (see the comment at the top of this file)."
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            echo "APP_VERSION_CODE=${{ github.run_number }}"
            echo "APP_VERSION_NAME=1.0.${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew
          if ! ./gradlew assembleRelease --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1; then
            # Put the reason on the run page (Annotations), so a failure can be read without opening the log.
            { grep -n -A12 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -c 1800; echo; echo ---; tail -n 25 "$RUNNER_TEMP/gradle.log" | head -c 1500; } > "$RUNNER_TEMP/why.txt"
            echo "::error title=Gradle build failed::$(sed -e 's/%/%25/g' -e 's/\r//g' "$RUNNER_TEMP/why.txt" | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Situation-X.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Situation-X-apk
          path: android-app/Situation-X.apk

      - name: Publish the download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Situation X for Android
          body: |
            Install: open this page on your Android phone, tap **Situation-X.apk**, then Open. If Android asks, allow "Install unknown apps" for your browser.
            Build ${{ github.run_number }}.
          files: android-app/Situation-X.apk
          make_latest: true
